<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFF69">
<meta name="robots" content="noindex, nofollow">
<title>Juego de memoria | ClickHouse</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* Tokens de marca ClickHouse
   primary.300 #FAFF69 (color héroe) · neutral.900 #151515 · blanco #FFFFFF
   Display: Söhne (si está instalada) con Inter como respaldo. UI y texto: Inter. */
:root{
  --yellow:#FAFF69;
  --black:#151515;
  --white:#FFFFFF;
  --ink-60:rgba(21,21,21,.62);
  --ink-30:rgba(21,21,21,.28);
  --display:'Söhne','Soehne','Inter',system-ui,-apple-system,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{
  font-family:var(--body);
  background:var(--yellow);
  color:var(--black);
  min-height:100vh;
  padding:22px 18px 34px;
  display:flex;justify-content:center;
}
.wrap{width:100%;max-width:430px}

.mark{display:block;height:17px;width:auto;margin-bottom:26px}
.mark svg{height:17px;width:auto;display:block}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-60);margin:0 0 10px}
h1{font-family:var(--display);font-size:34px;line-height:.98;font-weight:800;letter-spacing:-.035em;margin:0 0 12px}
h2{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.lead{font-size:15px;line-height:1.45;margin:0 0 22px;max-width:34ch}
.step{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px}
.panel{background:var(--white);border-radius:4px;padding:18px;margin-bottom:14px}
.panel p{font-size:14.5px;line-height:1.5;margin:0 0 15px}
.note{font-size:13px;line-height:1.5;color:var(--ink-60);margin:0}

/* Botón: bloque negro con el corte angular de la identidad */
.btn{
  position:relative;display:block;width:100%;border:0;border-radius:0;
  padding:16px 18px;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.015em;
  background:var(--black);color:var(--white);cursor:pointer;text-align:left;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
}
.btn:disabled{background:var(--ink-30);color:rgba(255,255,255,.75);cursor:default}
.btn.ghost{background:transparent;color:var(--black);border:1.5px solid var(--black);font-weight:600;font-size:14.5px;padding:13px 16px;clip-path:none}
.btn+.btn{margin-top:10px}
a.btn{text-decoration:none}
:focus-visible{outline:2.5px solid var(--black);outline-offset:2px}

.check{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.35;cursor:pointer;margin:0 0 18px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--black);flex:0 0 auto;margin:0}

label.field{display:block;margin-bottom:14px}
label.field span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
input[type=text],input[type=email],input[type=password],input[type=tel],select{
  width:100%;background:var(--white);border:1.5px solid var(--black);border-radius:4px;
  padding:14px 12px;color:var(--black);font-family:var(--body);font-size:16px;font-weight:500;
}
input::placeholder{color:var(--ink-30)}
/* font-size:16px en todos los campos: por debajo de eso iOS hace zoom al enfocar
   y descuadra el formulario. */
select{
  appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:38px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23151515' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;background-size:12px;
}
select:invalid{color:var(--ink-30)}   /* el placeholder se ve gris hasta elegir */
.err{font-size:13px;font-weight:600;background:var(--black);color:var(--white);padding:9px 11px;border-radius:4px;margin:10px 0 0}

/* Cronómetro */
.hud{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--black);padding-bottom:12px;margin-bottom:16px}
.hud small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-60);margin-bottom:1px}
.hud .t{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.hud .p{font-family:var(--display);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* Cartas */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{
  position:relative;aspect-ratio:3/4;border:0;border-radius:4px;overflow:hidden;
  background:var(--black);padding:7px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:11.5px;font-weight:700;line-height:1.15;
  color:transparent;text-align:center;letter-spacing:-.015em;
  transition:background .14s linear,color .05s linear;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
.tile .slash{position:absolute;inset:0;background:var(--yellow);
  clip-path:polygon(100% 34%,100% 66%,0 100%,0 68%)}
.tile.up,.tile.done{background:var(--white);color:var(--black)}
.tile.up .slash,.tile.done .slash{display:none}
.tile.done{opacity:.42}
.tile.miss{animation:shake .34s linear}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tile:disabled{cursor:default}

/* Resultado */
.readout{background:var(--white);border-left:5px solid var(--black);border-radius:0 4px 4px 0;padding:14px 16px;margin:0 0 18px;font-size:14.5px;line-height:1.55;font-variant-numeric:tabular-nums}
.readout b{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.rank-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 8px}
.rank-h span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60)}
table{width:100%;border-collapse:collapse}
td{border-bottom:1px solid var(--ink-30);padding:12px 0;font-size:14.5px;font-weight:500;vertical-align:middle}
td.pos{font-family:var(--display);font-weight:800;font-size:14px;width:34px;font-variant-numeric:tabular-nums}
td.time{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
tr.me td{background:var(--black);color:var(--white);font-weight:700}
tr.me td.pos{padding-left:8px}
tr.me td.time{padding-right:8px}
.empty{font-size:14px;color:var(--ink-60);padding:16px 0;margin:0}
footer{margin-top:28px;border-top:2px solid var(--black);padding-top:14px;font-size:11.5px;line-height:1.6;color:var(--ink-60);font-weight:500}
footer b{font-weight:700;color:var(--black);cursor:pointer}
textarea{width:100%;height:130px;background:var(--white);border:1.5px solid var(--black);border-radius:4px;color:var(--black);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;padding:10px;margin-top:10px}
.hide{display:none!important}

/* Partida en curso: el tablero ocupa la pantalla completa, sin scroll */
#app.play{height:100dvh;padding:14px 14px 18px;overflow:hidden}
#app.play .wrap{display:flex;flex-direction:column;height:100%;max-width:520px}
#app.play .grid{flex:1;min-height:0;grid-template-rows:repeat(6,1fr)}
#app.play .tile{aspect-ratio:auto;height:100%}

/* Celular chico */
@media(max-width:359px){
  h1{font-size:29px}
  .tile{font-size:10.5px;padding:5px}
  .grid{gap:6px}
}
/* Celular en horizontal: seis columnas para no perder cartas de vista */
@media(orientation:landscape) and (max-height:620px){
  #app.play .wrap{max-width:900px}
  #app.play .grid{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr)}
  #app.play .hud{padding-bottom:8px;margin-bottom:10px}
  #app.play .hud .t{font-size:24px}
}
/* Tablet y escritorio */
@media(min-width:640px){
  #app{padding:40px 24px 48px}
  .wrap{max-width:560px}
  h1{font-size:46px}
  .lead{font-size:16.5px}
  .tile{font-size:13.5px}
  #app.play{padding:28px 24px 32px}
  #app.play .hud .t{font-size:38px}
}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile.miss{animation:none}}
</style>

/* ============================================================ */
const root = document.getElementById("root");
const app = document.getElementById("app");
const DEMO = !CONFIG.ch.key || /[?&]demo\b/.test(location.search);
const LS = "memoria-clickhouse";
let state = { screen:"form", player:null, ms:0, pos:null, total:0, top:[], saved:true };

/* ============================================================
   OBSERVABILIDAD — ClickStack
   Todo pasa por track(): si el SDK no cargó o falla, el juego no se entera.
   ============================================================ */
const HDX = window.HyperDX;
const sessionId = (window.crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : "s-" + Math.random().toString(36).slice(2) + Date.now().toString(36);

if(HDX && CONFIG.hdxKey){
  try{
    HDX.init({
      apiKey: CONFIG.hdxKey,
      service: CONFIG.hdxService,
      ...(CONFIG.hdxUrl ? { url: CONFIG.hdxUrl } : {}),
      consoleCapture: true,
      /* El replay es la demo: se ve el tablero, los aciertos y las dudas.
         maskAllInputs tapa nombre, apellido y correo mientras se escriben. */
      disableReplay: false,
      maskAllInputs: true,
      blockSelector: "[data-private]",
      /* En false a propósito: no queremos cuerpos ni headers de red del stand. */
      advancedNetworkCapture: false
    });
    HDX.setGlobalAttributes({ sessionId, evento:CONFIG.eventLabel, demo:String(DEMO) });
  }catch(e){}
}
const track = (name, attrs) => { try{ HDX && HDX.addAction(name, {sessionId, ...attrs}); }catch(e){} };

const esc = s => String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fmt = ms => {
  const s = Math.floor(ms/1000), d = Math.floor((ms%1000)/100);
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+"."+d;
};
const secs = ms => (ms/1000).toFixed(3);
const logo = () => `<span class="mark">${LOGO}</span>`;
const initial = (n,a) => n + (a ? " " + a.trim()[0].toUpperCase() + "." : "");

/* Llamada a un Query Endpoint de ClickHouse Cloud.
   Los INSERT responden el texto "OK"; los SELECT responden JSONEachRow, que
   es NDJSON (un objeto por línea), no un array. Siempre devolvemos un array
   de filas para que quien llama no tenga que distinguir. */
async function chq(name, params){
  if(DEMO) throw new Error("demo");
  const u = new URL(CONFIG.ch.base + "/" + CONFIG.ch.ep[name]);
  u.searchParams.set("format", "JSONEachRow");
  /* Un parámetro ausente devuelve 400: siempre mandamos la clave, aunque vaya vacía. */
  Object.keys(params).forEach(k =>
    u.searchParams.set("param_" + k, params[k] === undefined || params[k] === null ? "" : String(params[k])));

  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 15000);
  try{
    const r = await fetch(u.toString(), {
      method: "GET",
      headers: { Authorization: "Basic " + btoa(CONFIG.ch.key + ":" + CONFIG.ch.secret) },
      signal: ctrl.signal
    });
    const txt = (await r.text()).trim();
    if(!r.ok) throw new Error("http " + r.status + " " + txt.slice(0, 140));
    if(!txt || txt === "OK") return [];
    return txt.split("\n").filter(Boolean).map(l => JSON.parse(l));
  } finally {
    clearTimeout(t);
  }
}

/* Modo demo: tabla guardada solo en este teléfono */
function demoRows(){ try{ return JSON.parse(localStorage.getItem(LS+"-demo") || "[]"); }catch(e){ return []; } }
function demoSave(name, ms){
  const r = demoRows(); r.push({name, ms}); r.sort((a,b) => a.ms-b.ms);
  localStorage.setItem(LS+"-demo", JSON.stringify(r));
  return r;
}

/* ---------- pantallas ---------- */
function screenForm(){
  app.classList.remove("play");
  root.innerHTML = `
    ${logo()}
    <p class="eyebrow">${esc(CONFIG.eventLabel)}</p>
    <h1>Juego de memoria</h1>
    <p class="lead">Nueve pares. Un intento. Gana el tiempo más bajo del día.</p>
    <p class="step">Tus datos</p>
    <label class="field"><span>Nombre</span><input type="text" id="n" autocomplete="given-name" placeholder="Camila"></label>
    <label class="field"><span>Apellido</span><input type="text" id="a" autocomplete="family-name" placeholder="Rojas"></label>
    <label class="field"><span>Correo electrónico corporativo</span><input type="email" id="e" autocomplete="email" inputmode="email" placeholder="camila@empresa.cl"></label>
    <label class="field"><span>Teléfono</span><input type="tel" id="t" autocomplete="tel" inputmode="tel" placeholder="+56 9 1234 5678"></label>
    <label class="field"><span>Empresa</span><input type="text" id="emp" autocomplete="organization" placeholder="ClickHouse"></label>
    <label class="field"><span>Industria</span><select id="ind" required>
      <option value="" disabled selected>Selecciona una opción</option>
      ${INDUSTRIAS.map(([v,l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}
    </select></label>
    <label class="field"><span>Cantidad de empleados</span><select id="cnt" required>
      <option value="" disabled selected>Selecciona una opción</option>
      ${EMPLEADOS.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("")}
    </select></label>
    <p class="note">Tienes un solo intento. El cronómetro parte cuando das vuelta la primera carta.</p>
    <p class="err hide" id="err"></p>
    <button class="btn" id="go" style="margin-top:18px">Comenzar a jugar</button>
    ${footer()}`;
  const err = document.getElementById("err");
  const show = m => { err.textContent = m; err.classList.remove("hide"); };
  track("form_visto");
  document.getElementById("go").onclick = async (ev) => {
    const n   = document.getElementById("n").value.trim();
    const a   = document.getElementById("a").value.trim();
    const e   = document.getElementById("e").value.trim();
    const t   = document.getElementById("t").value.trim();
    const emp = document.getElementById("emp").value.trim();
    const ind = document.getElementById("ind").value;
    const cnt = document.getElementById("cnt").value;
    err.classList.add("hide");
    const malo = (campo, msg) => { track("form_invalido", {campo}); show(msg); };
    if(n.length < 2)   return malo("nombre",    "Escribe tu nombre.");
    if(a.length < 2)   return malo("apellido",  "Escribe tu apellido.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) return malo("correo", "Revisa tu correo.");
    /* Solo contamos dígitos: así aceptamos +56 9 1234 5678, (56) 912345678, etc. */
    if(t.replace(/\D/g, "").length < 8) return malo("telefono", "Revisa tu teléfono.");
    if(emp.length < 2) return malo("empresa",   "Escribe el nombre de tu empresa.");
    if(!ind)           return malo("industria", "Elige tu industria.");
    if(!cnt)           return malo("empleados", "Elige la cantidad de empleados.");
    state.player = { n, a, e, t, emp, ind, cnt };
    /* Envío deliberado, no capturado del teclado: liga la sesión a la persona
       registrada. Borra estas dos líneas si prefieres telemetría anónima. */
    try{ HDX && HDX.setGlobalAttributes({ userEmail:e, userName:n+" "+a }); }catch(e2){}
    if(DEMO){ track("registro_ok", {modo:"demo"}); state.screen = "game"; return render(); }
    ev.target.disabled = true; ev.target.textContent = "Verificando";

    /* Solo bloqueamos con un "ya jugó" confirmado por el servidor. Si la
       consulta falla por red, dejamos jugar: en un stand es peor dejar a
       alguien fuera por el wifi que permitir un intento repetido. */
    try{
      const d = await chq("yaJugo", { evento:CONFIG.eventLabel, correo:e });
      if(d[0] && Number(d[0].dup) === 1){
        ev.target.disabled = false; ev.target.textContent = "Comenzar a jugar";
        track("registro_rechazado", {motivo:"dup"});
        return show("Este correo ya participó. Cada persona juega una sola vez.");
      }
    }catch(err2){
      track("yajugo_error_red", {motivo:String(err2 && err2.message || err2)});
    }

    /* Tampoco bloqueamos si falla el registro: el endpoint "tiempo" reinserta
       la fila completa al terminar, así que se recupera solo. Únicamente se
       pierde el dato si además abandona la partida. */
    try{
      await chq("registro", { evento:CONFIG.eventLabel, correo:e, nombre:n, apellido:a,
                              telefono:t, empresa:emp, industria:ind, empleados:cnt,
                              session_id:sessionId });
      track("registro_ok", {modo:"servidor"});
    }catch(err2){
      track("registro_error_red", {motivo:String(err2 && err2.message || err2)});
    }
    state.screen = "game"; render();
  };
}

function screenGame(){
  app.classList.add("play");
  const deck = WORDS.concat(WORDS).map(w => ({w, id:Math.random()})).sort((x,y) => x.id-y.id);
  root.innerHTML = `
    <div class="hud">
      <div><small>Elapsed</small><div class="t" id="clock">00:00.0</div></div>
      <div class="p"><small>Pares</small><span id="pairs">0</span>/9</div>
    </div>
    <div class="grid" id="grid">${deck.map((c,i) =>
      `<button class="tile" data-i="${i}" data-w="${esc(c.w)}" aria-label="Carta ${i+1}"><span class="slash"></span>${esc(c.w)}</button>`
    ).join("")}</div>`;

  let t0 = 0, timer = null, open = [], found = 0, lock = false, flips = 0, fallos = 0;
  const clock = document.getElementById("clock");
  const tick = () => clock.textContent = fmt(Date.now() - t0);
  track("tablero_visto");

  document.getElementById("grid").onclick = (ev) => {
    const el = ev.target.closest(".tile");
    if(!el || lock || el.classList.contains("up") || el.classList.contains("done")) return;
    if(!t0){ t0 = Date.now(); timer = setInterval(tick, 100); track("partida_iniciada"); }
    el.classList.add("up"); open.push(el); flips++;
    if(open.length < 2) return;
    const [x,y] = open;
    if(x.dataset.w === y.dataset.w){
      x.classList.replace("up","done"); y.classList.replace("up","done");
      open = []; found++;
      document.getElementById("pairs").textContent = found;
      track("par_encontrado", { concepto:x.dataset.w, pares:found, flips, elapsed_ms:Date.now()-t0 });
      if(found === WORDS.length){
        clearInterval(timer);
        state.ms = Date.now() - t0;
        state.flips = flips; state.fallos = fallos;
        track("partida_completada", { elapsed_ms:state.ms, flips, fallos,
          precision:+(WORDS.length / (WORDS.length + fallos)).toFixed(3) });
        setTimeout(finish, 420);
      }
    } else {
      lock = true; fallos++;
      track("par_fallado", { fallos, flips, elapsed_ms:Date.now()-t0 });
      x.classList.add("miss"); y.classList.add("miss");
      setTimeout(() => {
        [x,y].forEach(c => c.classList.remove("up","miss"));
        open = []; lock = false;
      }, 700);
    }
  };
}

async function finish(){
  const p = state.player;
  /* Guardamos la ficha completa, no solo el correo. El correo hace falta para
     recuperar la posición al volver; el resto, porque "tiempo" reinserta la fila
     entera: si reintentáramos con los campos vacíos, borraríamos teléfono,
     empresa, industria y dotación de quien ya los había dado. */
  try{ localStorage.setItem(LS, JSON.stringify({
    n:p.n, a:p.a, e:p.e, t:p.t, emp:p.emp, ind:p.ind, cnt:p.cnt, ms:state.ms
  })); }catch(e){}
  if(DEMO){
    const rows = demoSave(initial(p.n,p.a), state.ms);
    state.top = rows.slice(0, CONFIG.prizeCount);
    state.total = rows.length;
    state.pos = rows.findIndex(r => r.ms === state.ms) + 1;
    state.saved = true;
    state.screen = "result"; return render();
  }
  app.classList.remove("play");
  root.innerHTML = `${logo()}<p class="eyebrow">Guardando tu tiempo</p><h1>${secs(state.ms)} sec</h1>`;
  state.saved = await sendScore();
  state.screen = "result"; render();
}

async function sendScore(){
  const p = state.player;
  for(let i = 0; i < 2; i++){
    try{
      /* Reinserta la fila completa: con ReplacingMergeTree la última versión
         reemplaza a la anterior, así que omitir nombre o apellido los borraría. */
      await chq("tiempo", { evento:CONFIG.eventLabel, correo:p.e, nombre:p.n, apellido:p.a,
                            telefono:p.t || "", empresa:p.emp || "",
                            industria:p.ind || "", empleados:p.cnt || "",
                            session_id:sessionId, elapsed_ms:state.ms,
                            flips:state.flips || 0, fallos:state.fallos || 0 });
      await refreshTop();
      track("tiempo_guardado", { intento:i+1, elapsed_ms:state.ms, posicion:state.pos, total:state.total });
      return true;
    }catch(e){ track("tiempo_error_red", { intento:i+1, motivo:String(e && e.message || e) }); }
  }
  track("tiempo_perdido", { elapsed_ms:state.ms });
  return false;
}

/* Refresca tabla y posición. Van por separado a propósito: si falla una,
   la otra igual se actualiza. */
async function refreshTop(){
  if(DEMO){ const r = demoRows(); state.top = r.slice(0, CONFIG.prizeCount); state.total = r.length; return; }
  try{
    const rows = await chq("top", { evento:CONFIG.eventLabel, limite:CONFIG.prizeCount });
    state.top = rows.map(r => ({ name:r.name, ms:Number(r.ms) }));
    track("tabla_actualizada", { filas:state.top.length });
  }catch(e){ track("tabla_error_red", {motivo:String(e && e.message || e)}); }

  const correo = state.player && state.player.e;
  if(!correo) return;
  try{
    const r = await chq("posicion", { evento:CONFIG.eventLabel, correo:correo });
    if(r[0]){
      state.pos   = Number(r[0].pos)   || null;   // 0 = aún sin tiempo registrado
      state.total = Number(r[0].total) || 0;
    }
  }catch(e){ track("posicion_error_red", {motivo:String(e && e.message || e)}); }
}

function screenResult(replay){
  app.classList.remove("play");
  const inPrize = state.pos && state.pos <= CONFIG.prizeCount;
  const mine = initial(state.player.n, state.player.a);
  root.innerHTML = `
    ${logo()}
    <p class="eyebrow">${replay ? "Ya participaste" : "Partida terminada"}</p>
    <h1>${replay ? "Tu resultado" : "Listo, " + esc(state.player.n)}</h1>
    <p class="readout">Nueve pares encontrados.<br>Elapsed: <b>${secs(state.ms)} sec</b>${
      state.pos ? `<br>Posición: <b>${state.pos}°</b> de ${state.total}` : ""}</p>
    ${state.saved ? `<p class="lead" style="margin-bottom:0">${
        inPrize ? `Estás entre los ${CONFIG.prizeCount} mejores tiempos. Pasa por el stand a las 14:00 del día 09 para retirar tu premio.`
                : `Los ${CONFIG.prizeCount} mejores tiempos del día se llevan un premio. Sigue la tabla en el stand.`}</p>`
      : `<p class="err">Tu tiempo no llegó al servidor. Toca "Enviar mi tiempo" o muestra esta pantalla al equipo del stand.</p>
         <button class="btn" id="rs" style="margin-top:12px">Enviar mi tiempo</button>`}
    ${rankTable(mine)}
    <button class="btn ghost" id="rf" style="margin-top:18px">Actualizar tabla</button>
    ${DEMO ? `<p class="note" style="margin-top:14px">Modo demo: la tabla es local y no se guarda en el servidor.</p>` : ""}
    ${footer()}`;
  document.getElementById("rf").onclick = async (ev) => {
    ev.target.textContent = "Actualizando";
    await refreshTop(); render();
  };
  const rs = document.getElementById("rs");
  if(rs) rs.onclick = async (ev) => {
    ev.target.disabled = true; ev.target.textContent = "Enviando";
    state.saved = await sendScore(); render();
  };
}

function rankTable(mine){
  const top = (state.top || []).slice(0, CONFIG.prizeCount);
  let marked = false;
  return `
    <div class="rank-h"><h2>Tabla de posiciones</h2><span>Top ${CONFIG.prizeCount}</span></div>
    ${top.length ? `<table>${top.map((r,i) => {
      /* Con servidor usamos la posición que devuelve ClickHouse: es exacta y no
         se confunde entre dos "Camila R.". El calce por nombre queda de respaldo
         para el modo demo o si la consulta de posición falló. */
      const me = !marked && (state.pos
        ? (i + 1) === state.pos
        : (r.name === mine && Math.abs(r.ms - state.ms) < 2));
      if(me) marked = true;
      return `<tr class="${me ? "me" : ""}">
        <td class="pos">${i+1}</td>
        <td>${esc(r.name)}${me ? " · tú" : ""}</td>
        <td class="time">${secs(r.ms)} s</td>
      </tr>`; }).join("")}</table>`
      : `<p class="empty">Todavía no hay partidas registradas. Sé el primero.</p>`}`;
}

function footer(){
  return `<footer>ClickHouse · La tabla se actualiza con cada partida.<br>Premios para los ${CONFIG.prizeCount} mejores tiempos, entregados a las 14:00 del día 09.</footer>`;
}

function render(){
  if(state.screen === "form") return screenForm();
  if(state.screen === "game") return screenGame();
  if(state.screen === "result") return screenResult(state.replay === true);
}

/* Arranque: si este teléfono ya jugó, muestra su resultado.
   Pruebas: ?reset=1 borra el registro local · ?demo=1 fuerza el modo sin servidor */
(async () => {
  if(/[?&]reset\b/.test(location.search)){
    try{ localStorage.removeItem(LS); localStorage.removeItem(LS+"-demo"); }catch(e){}
    history.replaceState(null, "", location.pathname);
  }
  let prev = null;
  try{ prev = JSON.parse(localStorage.getItem(LS) || "null"); }catch(e){}
  if(prev && prev.ms){
    state.player = { n:prev.n, a:prev.a, e:prev.e || "", t:prev.t || "",
                     emp:prev.emp || "", ind:prev.ind || "", cnt:prev.cnt || "" };
    state.ms = prev.ms; state.replay = true; state.screen = "result";
    track("jugador_recurrente", { elapsed_ms:prev.ms });
    root.innerHTML = `${logo()}<p class="eyebrow">Cargando tabla</p>`;
    await refreshTop();
    return render();
  }
  track("sesion_nueva");
  render();
})();

</script>
